name: Build and Release

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "**/*.md"

  pull_request:
    branches: ["main"]
    paths-ignore:
      - "**/*.md"

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  prepare:
    name: Prepare Workspace
    runs-on: ubuntu-latest
    outputs:
      date: ${{ steps.set-vars.outputs.date }}
      short-sha: ${{ steps.set-vars.outputs.short-sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set variables
        id: set-vars
        run: |
          echo "date=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT
          echo "short-sha=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

  build:
    needs: prepare
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: windows-latest
            platform: win64
            arch: x64
          - os: ubuntu-latest
            platform: linux-x64
            arch: x64
          - os: macos-latest
            platform: macos-x64
            arch: x64
          - os: macos-latest
            platform: macos-arm64
            arch: arm64
      fail-fast: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build build-essential libx11-dev libxkbfile-dev libsecret-1-dev

      - name: Install system dependencies (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          choco install cmake ninja visualstudio2022buildtools visualstudio2022-workload-vctools -y

      - name: Install npm dependencies
        run: npm ci

      - name: Build native addon
        shell: bash
        run: |
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            npm run build:native -- --arch=arm64
          else
            npm run build:native -- --arch=x64
          fi
        env:
          CMAKE_BUILD_PARALLEL_LEVEL: 4

      - name: Build application
        run: npm run build

      - name: Build distributables (zip only for CI)
        shell: bash
        run: |
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            npm run dist:ci -- --arm64
          else
            npm run dist:ci -- --x64
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: electroncpp-${{ matrix.platform }}-${{ needs.prepare.outputs.date }}-${{ needs.prepare.outputs.short-sha }}
          path: release/*.zip
          if-no-files-found: error
